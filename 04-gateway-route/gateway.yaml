##
## Gateway for Kubecost — uses Envoy Gateway (GatewayClass: eg)
##
## If you already have a shared Gateway in another namespace,
## skip this file and update httpRoute.parentRefs in values.yaml
## to reference your existing Gateway.
##
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kubecost-gateway
  namespace: kubecost
  labels:
    app.kubernetes.io/part-of: kubecost
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: kubecost.aks.mydomain.com
      allowedRoutes:
        namespaces:
          from: Same
---
##
## HTTPRoute is managed by the Helm chart (httpRoute section in values.yaml).
## This file provides the Gateway resource that the chart's HTTPRoute attaches to.
##
